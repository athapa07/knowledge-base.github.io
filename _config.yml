###########################################################
### Beautiful Jekyll config — Knowledge Base
###########################################################

############################
# --- Required options --- #
############################

title: "Anil's Knowledge Base"

author: Anil Thapa

###############################################
# --- List of links in the navigation bar --- #
###############################################

navbar-links:
  Home: ""
  # Tools: "tools"
  # Guides: "guides"
  # About: "aboutme"

################
# --- Logo --- #
################

# Remove or replace with your own image at /assets/img/avatar-icon.png
avatar: "/assets/img/avatar-icon.png"
round-avatar: true

#####################################
# --- Footer social media links --- #
#####################################

social-network-links:
  email: "anilthapa07@outlook.com"
  github: athapa07
  linkedin: "/anil-thapa-33a204114/"

###########################
# --- General options --- #
###########################

share-links-active:
  twitter: false
  facebook: false
  linkedin: false
  vk: false
  reddit: false

title-on-all-pages: true

excerpt_length: 50

feed_show_excerpt: true
feed_show_tags: true

post_search: true

edit_page_button: true

navbar-var-length: false

keywords: "knowledge base,tools,guides,notes,anil thapa"

######################################
# --- Colours / background image --- #
######################################

page-col: "#FFFFFF"
text-col: "#404040"
link-col: "#008AFF"
hover-col: "#0085A1"
navbar-col: "#EAEAEA"
navbar-text-col: "#404040"
navbar-border-col: "#DDDDDD"
footer-col: "#EAEAEA"
footer-text-col: "#777777"
footer-link-col: "#404040"
footer-hover-col: "#0085A1"

####################
# --- Comments --- #
####################
# Left disabled — uncomment and configure if you want comments later (e.g. giscus via GitHub Discussions)

################
# --- Misc --- #
################

date_format: "%B %-d, %Y"

#################################################################################
# --- Core Jekyll settings --- #
#################################################################################

timezone: "Australia/Sydney"
markdown: kramdown
highlighter: rouge
permalink: /:year-:month-:day-:title/
paginate: 5

kramdown:
  input: GFM

# Default layout rules
defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: false
      social-share: true
  -
    scope:
      path: ""
    values:
      layout: "page"

# Exclude these files from the built site
exclude:
  - CHANGELOG.md
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - screenshot.png
  - docs/

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-seo-tag

